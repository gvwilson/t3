project:
  type: book
  output-dir: docs

book:
  title: "Teaching Tech Together"
  repo-url: "https://github.com/gvwilson/t3"
  repo-actions: [edit, source, issue]
  chapters:
    - index.qmd
    - intro.qmd
    - models.qmd
    - memory.qmd
    - architecture.qmd
    - individual.qmd
    - process.qmd
    - pck.qmd
    - performance.qmd
    - classroom.qmd
    - motivation.qmd
    - online.qmd
    - exercises.qmd
    - community.qmd
    - outreach.qmd
    - finale.qmd
  appendices:
    - license.qmd
    - conduct.qmd
    - joining.qmd
    - glossary.qmd
    - meetings.qmd
    - checklists.qmd
    - conceptmaps.qmd
    - chunking.qmd
    - bibliography.qmd

bibliography: book.bib
csl: mccole/book.csl

filters:
  - mccole/links.lua

shortcodes:
  - mccole/glossary.lua
  - mccole/inc-noh1.lua
  - mccole/index.lua

format:
  html:
    css: mccole/book.css
    link-citations: true
    theme: cosmo
    toc: true
  pdf:
    documentclass: mccole/krantz
